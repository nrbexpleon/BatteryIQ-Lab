name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run check
      - name: Test
        shell: bash
        run: |
          if ! npm test > test.log 2>&1; then
            grep -E "(not ok|error:|AssertionError|ERR_)" test.log | head -50 | while IFS= read -r line; do echo "::error::$line"; done
            cat test.log
            exit 1
          fi
      - run: npm run demo
